[tool.poetry]
name = "connectedpapers-py"
version = "0.2.5"
description = "The official python client for the connected papers API."
authors = ["ConnectedPapersAdmin <admin@connectedpapers.com>", "KanHar <knaan.harpaz@gmail.com>"]
readme = "README.md"
packages = [{include = "connectedpapers"}]
repository = "https://github.com/ConnectedPapers/connectedpapers-py/"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11"
aiohttp = "^3.14.5"
dacite = "^1.9.2"
nest-asyncio2 = "^1.7.4"

[dependency-groups]
test = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
    "build>=1.6.1,<2",
]
dev = [
    {include-group = "test"},
    "black>=26.10.1,<27",
    "mypy>=2.4.1,<3",
    "isort>=9.0.2,<10",
    "flake8>=7.5.0,<8",
    "flake8-black>=0.5.0,<0.6",
    "flake8-pyproject>=1.2.4,<2",
]

[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.flake8]
ignore = ["E501", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: live Connected Papers API tests (requires --live-api)"]
