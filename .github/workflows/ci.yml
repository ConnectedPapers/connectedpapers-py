name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum minor as well as every released minor covered.
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Clean consumer-style dependency installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install . 'pytest>=7.4,<8' 'pytest-asyncio>=0.21,<0.22' build
          python -m pip check
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify built wheel outside the source tree
        run: |
          python -m venv /tmp/sdk-wheel
          /tmp/sdk-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sdk-wheel/bin/python -c "from connectedpapers import ConnectedPapersClient; import importlib.resources as r; assert callable(ConnectedPapersClient); assert r.is_resource('connectedpapers', 'py.typed')"
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . 'mypy>=1.4,<1.5' 'flake8>=6,<7' 'flake8-black>=0.3,<0.4' 'flake8-pyproject>=1.2,<1.3' 'black>=23.3,<24' 'pytest>=7.4,<8'
      - run: python -m mypy --strict connectedpapers tests usage_samples
      - run: python -m flake8 connectedpapers tests usage_samples
